[package]
name = "kubernetes-vtab"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlite-loadable = "0.0.5"
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
tokio = { version = "1.35", features = ["rt"] }
