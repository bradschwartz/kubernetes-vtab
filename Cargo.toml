[package]
name = "kubernetes-vtab"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlite-loadable = "0.0.5"
kube = { version = "0.96", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
tokio = { version = "1.35", features = ["rt"] }
